services:
  mongo:
    container_name: db-mongo-nuxt
    image: mongo:4.0
    volumes:
      - ${MONGO_DIR:-./data/mongodb}:/data/db
    ports:
      - 127.0.0.1:27017:27017
    networks:
      - webnet

  api:
    container_name: api-express-nuxt
    image: lincenying/api-express:${API_TAG}
    environment:
      DATABASE_URL: mongodb://mongo:27017
    ports:
      - 4008:4000
    depends_on:
      - mongo
    networks:
      - webnet

  nuxt:
    container_name: app-nuxt
    image: lincenying/app-nuxt:${TAG}
    environment:
      NUXT_API_URL: http://api:4000
      NUXT_ENV_API_URL: http://api:4000
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
      - api
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 7200:7200
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
